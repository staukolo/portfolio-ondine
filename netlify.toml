# réglages Netlify : le build du site et le mot de passe de l'espace enseignants
[build]
  command = "npm run build"
  publish = "dist"

[[edge_functions]]
  path = "/espace-enseignants"
  function = "protege-enseignants"

[[edge_functions]]
  path = "/espace-enseignants/*"
  function = "protege-enseignants"
